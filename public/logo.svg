<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#F9F7F3" stroke="#3D0050" stroke-width="2"/>
  
  <!-- Globe with grid lines -->
  <circle cx="64" cy="64" r="35" fill="#E8F4F8" stroke="#3D0050" stroke-width="2"/>
  <ellipse cx="64" cy="64" rx="35" ry="12" fill="none" stroke="#3D0050" stroke-width="1" opacity="0.5"/>
  <ellipse cx="64" cy="64" rx="12" ry="35" fill="none" stroke="#3D0050" stroke-width="1" opacity="0.5"/>
  <path d="M29 64 C29 64, 39 58, 64 58 C89 58, 99 64, 99 64" fill="none" stroke="#3D0050" stroke-width="1" opacity="0.5"/>
  <path d="M29 64 C29 64, 39 70, 64 70 C89 70, 99 64, 99 64" fill="none" stroke="#3D0050" stroke-width="1" opacity="0.5"/>
  
  <!-- Cross -->
  <rect x="60" y="45" width="8" height="38" fill="#7B0F16"/>
  <rect x="52" y="55" width="24" height="8" fill="#7B0F16"/>
  
  <!-- Flame above cross -->
  <path d="M64 40 C64 40, 58 32, 60 26 C62 20, 68 20, 64 40" fill="#D4A017"/>
  <path d="M64 38 C64 38, 60 32, 62 28 C64 24, 68 24, 64 38" fill="#F4E4C1"/>
  
  <!-- Wheat stalks below -->
  <g transform="translate(64, 85)">
    <!-- Center stalk -->
    <path d="M0 0 L0 15" stroke="#8B7355" stroke-width="2"/>
    <ellipse cx="-3" cy="12" rx="4" ry="2" fill="#D4A017" transform="rotate(-20 -3 12)"/>
    <ellipse cx="3" cy="12" rx="4" ry="2" fill="#D4A017" transform="rotate(20 3 12)"/>
    <ellipse cx="-3" cy="8" rx="4" ry="2" fill="#D4A017" transform="rotate(25 -3 8)"/>
    <ellipse cx="3" cy="8" rx="4" ry="2" fill="#D4A017" transform="rotate(-25 3 8)"/>
    
    <!-- Left stalk -->
    <path d="M-8 2 L-8 17" stroke="#8B7355" stroke-width="1.5"/>
    <ellipse cx="-11" cy="14" rx="3" ry="1.5" fill="#D4A017" transform="rotate(-15 -11 14)"/>
    <ellipse cx="-5" cy="14" rx="3" ry="1.5" fill="#D4A017" transform="rotate(15 -5 14)"/>
    
    <!-- Right stalk -->
    <path d="M8 2 L8 17" stroke="#8B7355" stroke-width="1.5"/>
    <ellipse cx="5" cy="14" rx="3" ry="1.5" fill="#D4A017" transform="rotate(-15 5 14)"/>
    <ellipse cx="11" cy="14" rx="3" ry="1.5" fill="#D4A017" transform="rotate(15 11 14)"/>
  </g>
  
  <!-- Glowing circular lines around globe -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="#D4A017" stroke-width="1" opacity="0.3"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#D4A017" stroke-width="0.5" opacity="0.2"/>
</svg>
